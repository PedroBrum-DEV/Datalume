spring:
  application:
    name: datalume
  # Em produção, sobrescreva com SPRING_PROFILES_ACTIVE=prod
  profiles:
    active: local
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/datalume}
    username: ${DB_USER:datalume}
    password: ${DB_PASSWORD:datalume}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: America/Sao_Paulo
  lifecycle:
    timeout-per-shutdown-phase: 20s
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

server:
  port: ${PORT:8080}
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
      roles: ADMIN_PLATAFORMA
  info:
    java:
      enabled: true
    build:
      enabled: true

logging:
  pattern:
    level: "%5p [%X{requestId:-}]"
  level:
    br.com.datalume: INFO

datalume:
  seguranca:
    # Obrigatório em produção (>= 32 caracteres). Sem valor padrão de propósito.
    jwt-secret: ${JWT_SECRET}
    jwt-expiracao: 1h
    emissor: datalume
    plano-padrao: GRATUITO
  referencia:
    # true => na subida, carrega municípios (IBGE) e CNAEs se as tabelas estiverem vazias
    carga-inicial: ${DATALUME_REFERENCIA_CARGA_INICIAL:false}
    ibge-url: https://servicodados.ibge.gov.br/api
